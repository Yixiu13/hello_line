<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>一句话</title>
<meta name="description" content="一个只显示一行字的极简网页" />
<style>
  :root {
    --bg-1: #f6f8fb;
    --bg-2: #eef2f7;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #6366f1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #0b1020;
      --bg-2: #141a2e;
      --text: #e8ecf5;
      --muted: #94a3b8;
      --accent: #818cf8;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    min-height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-content: center;
    min-height: 100vh;
    padding: 32px 24px 48px;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background:
      radial-gradient(38% 38% at 22% 28%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%),
      radial-gradient(34% 34% at 78% 72%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%);
    filter: blur(10px);
    z-index: -1;
    animation: drift 18s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 1.5%, 0) scale(1.06); }
  }

  main {
    text-align: center;
    max-width: 900px;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 6.5vw, 72px);
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.02em;
    word-break: break-word;
  }

  h1 {
    cursor: pointer;
    user-select: none;
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  h1:hover { opacity: 0.9; }
  h1:active { transform: scale(0.985); }
  h1.is-swapping {
    opacity: 0;
    transform: translateY(-8px);
  }

  h1:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 10px;
    border-radius: 8px;
  }

  .hint {
    margin: 16px 0 0;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.08em;
    cursor: pointer;
    user-select: none;
  }

  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  figure {
    margin: clamp(22px, 4.5vw, 38px) auto 0;
    max-width: min(78vw, 400px);
    animation: rise 1s ease both 0.4s;
  }

  figure img {
    display: block;
    max-width: 100%;
    max-height: 62vh;
    margin: 0 auto;
    height: auto;
    border-radius: 20px;
    box-shadow:
      0 22px 44px -20px rgba(15, 23, 42, 0.5),
      0 2px 8px rgba(15, 23, 42, 0.08);
    transition: opacity 0.22s ease;
  }

  figure.is-swapping img {
    opacity: 0;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    body::before, figure { animation: none; }
    h1, h1.is-swapping { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <h1 id="line" role="button" tabindex="0" aria-label="点击切换文字">蕾宝今天也要开心呀！</h1>
    <p class="hint" id="hint">点一下，换一句</p>
    <figure id="photo-wrap">
      <img id="photo" src="images/photo.webp" alt="照片" />
    </figure>
  </main>
  <footer id="footer"></footer>

<script>
  // 点击后轮流显示的句子：想改内容 / 加句子，改这个数组即可
  // 图片默认还是放在 images/ 目录下（和之前一样的路径）
  // 把新图命名为 1.webp、2.webp … 放进 images/ 就会自动生效
  const IMG_DIR = "images/";
  const DEFAULT_IMG = IMG_DIR + "photo.webp";

  // 每一句配一张图；img 文件不存在时自动回退到 photo.webp
  const MESSAGES = [
    { text: "蕾宝今天也要开心呀！", img: IMG_DIR + "1.webp" },
    { text: "今天也有一点点小确幸", img: IMG_DIR + "2.webp" },
    { text: "愿你被这个世界温柔以待", img: IMG_DIR + "3.webp" },
    { text: "别急，慢慢来，一切都来得及", img: IMG_DIR + "4.webp" },
    { text: "记得喝水，记得笑", img: IMG_DIR + "5.webp" },
  ];

  // 也支持网址传参临时改第一句：https://xxx.com/?t=今天也要开心呀
  const params = new URLSearchParams(location.search);
  const custom = (params.get("t") || params.get("text") || "").trim();
  const list = custom ? [{ text: custom, img: DEFAULT_IMG }, ...MESSAGES] : MESSAGES;

  const el = document.getElementById("line");
  const hint = document.getElementById("hint");
  const footer = document.getElementById("footer");
  const wrap = document.getElementById("photo-wrap");
  const photo = document.getElementById("photo");

  let index = 0;
  let busy = false;

  // 预加载：图片不存在就回退，避免切换时出现空白
  list.forEach((item) => {
    const probe = new Image();
    probe.onerror = () => { item.img = DEFAULT_IMG; };
    probe.src = item.img;
  });

  function show(item) {
    el.textContent = item.text;
    if (photo.getAttribute("src") !== item.img) photo.src = item.img;
    document.title = item.text;
    footer.textContent = item.text;
  }

  function next() {
    if (busy || list.length < 2) return;
    busy = true;
    el.classList.add("is-swapping");
    wrap.classList.add("is-swapping");
    setTimeout(() => {
      index = (index + 1) % list.length;
      show(list[index]);
      el.classList.remove("is-swapping");
      wrap.classList.remove("is-swapping");
      busy = false;
    }, 220);
  }

  show(list[0]);

  el.addEventListener("click", next);
  hint.addEventListener("click", next);
  el.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      next();
    }
  });
</script>
</body>
</html>
