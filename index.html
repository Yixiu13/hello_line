<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>一句话</title>
<meta name="description" content="一个只显示一行字的极简网页" />
<style>
  :root {
    --bg-1: #f6f8fb;
    --bg-2: #eef2f7;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #6366f1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #0b1020;
      --bg-2: #141a2e;
      --text: #e8ecf5;
      --muted: #94a3b8;
      --accent: #818cf8;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background:
      radial-gradient(38% 38% at 22% 28%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%),
      radial-gradient(34% 34% at 78% 72%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%);
    filter: blur(10px);
    z-index: -1;
    animation: drift 18s ease-in-out infinite alternate;
  }

  @keyframes drift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 1.5%, 0) scale(1.06); }
  }

  main {
    text-align: center;
    max-width: 900px;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 6.5vw, 72px);
    line-height: 1.25;
    font-weight: 700;
    letter-spacing: -0.02em;
    word-break: break-word;
  }

  h1 .cursor {
    display: inline-block;
    width: 0.06em;
    height: 1em;
    margin-left: 0.08em;
    background: var(--accent);
    vertical-align: -0.1em;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink { 50% { opacity: 0; } }

  footer {
    position: fixed;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  @media (prefers-reduced-motion: reduce) {
    body::before, h1 .cursor { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <h1 id="line">你好，世界</h1>
  </main>
  <footer id="footer"></footer>

<script>
  // 要显示的文字：修改 DEFAULT_TEXT 即可
  const DEFAULT_TEXT = "蕾宝今天也要开心呀！";

  // 也支持通过网址传参，例如：https://xxx.com/?t=今天也要开心呀
  const params = new URLSearchParams(location.search);
  const text = (params.get("t") || params.get("text") || DEFAULT_TEXT).trim() || DEFAULT_TEXT;
  const el = document.getElementById("line");

  el.textContent = text;
  document.title = text;
  document.getElementById("footer").textContent = text;

  // 打字机效果
  el.textContent = "";
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  el.appendChild(cursor);
  let i = 0;
  const timer = setInterval(() => {
    if (i >= text.length) return clearInterval(timer);
    cursor.insertAdjacentText("beforebegin", text[i++]);
  }, 90);
</script>
</body>
</html>
